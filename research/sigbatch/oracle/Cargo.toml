[package]
name = "sigbatch-oracle"
version = "0.1.0"
edition = "2021"

[dependencies]
zcash_primitives = { version = "0.31", default-features = false, features = ["std"] }
zcash_protocol = "0.11"
orchard = { version = "0.16", features = ["circuit"] }
halo2_proofs = "0.4"
hex = "0.4"
anyhow = "1"
pasta_curves = "0.6"
ff = "0.14"
group = "0.14"
reddsa = "0.6"
rand = "0.10"
rayon = "1"

[profile.release]
opt-level = 3

# Same vendored orchard/halo2 as research/proofsets/oracle (read-only), so versions and build cache match.
[patch.crates-io]
halo2_proofs = { path = "../../../zcash/halo2/oracle/vendor/halo2_proofs" }
orchard = { path = "../../../zcash/halo2/oracle/vendor/orchard" }
