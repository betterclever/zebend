[package]
name = "zc-redpallas"
version = "0.1.0"
edition = "2021"
description = "research/sigbatch/oracle's Rust RedPallas baseline, rebuilt on the Zakura Common crates"

# Dependencies as Zakura's workspace Cargo.toml declares them (zakura-core/common, =4.0.0).
[dependencies]
reddsa = { version = "=4.0.0", package = "zakura-reddsa" }
pasta_curves = { version = "=4.0.0", package = "zakura-pasta-curves" }
group = "0.14"
ff = "0.14"
anyhow = "1"
rand = "0.10"
rayon = "1.10"

# Zakura's release profile (zakura/Cargo.toml): thin LTO, 4 units, 1 unit per dependency.
[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 4

[profile.release.package."*"]
codegen-units = 1
