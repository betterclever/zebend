[package]
name = "redjubjub-zakura"
version = "0.1.0"
edition = "2021"
description = "zcash/sapling/oracle's `rust` RedJubjub baseline, on the Zakura Common crates (zakura-redjubjub, zakura-jubjub, zakura-sapling-crypto)"

[dependencies]
# as zakura's workspace Cargo.toml
redjubjub = { version = "=4.0.0", package = "zakura-redjubjub" }
jubjub = { version = "=4.0.0", package = "zakura-jubjub" }
sapling-crypto = { version = "=4.0.0", package = "zakura-sapling-crypto", default-features = false, features = ["circuit", "multicore"] }
group = "0.14"
rand = "0.10"
rand_core = "0.10"
rand_chacha = "0.10"
rayon = "1"
anyhow = "1"

[profile.release]
opt-level = 3
