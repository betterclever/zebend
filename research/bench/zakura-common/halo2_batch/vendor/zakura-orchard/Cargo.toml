[package]
edition = "2024"
rust-version = "1.97"
name = "zakura-orchard"
version = "4.0.0"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
build = false
exclude = ["/AGENTS.md"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The Orchard shielded transaction protocol"
readme = "README.md"
keywords = [
    "cryptography",
    "orchard",
    "zero-knowledge",
    "zcash",
]
categories = ["cryptography::cryptocurrencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/common"

[package.metadata.docs.rs]
features = [
    "test-dependencies",
    "unstable-frost",
    "weighted-merkle",
    "circuit-composition",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--html-in-header",
    "katex-header.html",
]

[features]
aarch64-asm = ["orchard-legacy?/aarch64-asm"]
backend-halo2 = ["dep:orchard-legacy"]
circuit = [
    "prover",
    "verifier",
]
circuit-composition = [
    "backend-halo2",
    "prover",
]
circuit-fixtures = [
    "orchard-legacy?/circuit-fixtures",
    "circuit",
]
default = [
    "backend-halo2",
    "wallet",
    "zip32-addresses",
    "circuit",
    "multicore",
    "std",
]
dev-graph = [
    "orchard-legacy?/dev-graph",
    "image",
    "plotters",
]
image = []
multicore = [
    "orchard-legacy?/multicore",
    "dep:maybe-rayon",
    "maybe-rayon/threads",
]
orbits = ["orchard-legacy?/orbits"]
portable = ["orchard-legacy?/portable"]
prover = [
    "std",
    "orchard-legacy?/circuit",
]
prover-fingerprint = [
    "orchard-legacy?/prover-fingerprint",
    "zip32-addresses",
    "circuit",
]
std = [
    "corez/std",
    "orchard-legacy?/std",
]
test-dependencies = [
    "wallet",
    "orchard-legacy?/test-dependencies",
    "proptest",
    "rand/std",
    "rand/std_rng",
]
unstable-frost = ["dep:visibility"]
verifier = [
    "std",
    "orchard-legacy?/circuit",
]
verifier-fingerprint = [
    "orchard-legacy?/verifier-fingerprint",
    "zip32-addresses",
    "circuit",
]
wallet = ["dep:zip32"]
weighted-merkle = []
x86_64-asm = ["orchard-legacy?/x86_64-asm"]
zip32-addresses = [
    "wallet",
    "dep:aes",
    "dep:fpe",
]

[lib]
name = "orchard"
path = "src/lib.rs"
bench = false

[[test]]
name = "builder"
path = "tests/builder.rs"

[[test]]
name = "composition_api"
path = "tests/composition_api.rs"
required-features = [
    "circuit-composition",
    "test-dependencies",
]

[[test]]
name = "ironwood_batch_timings"
path = "tests/ironwood_batch_timings.rs"
required-features = [
    "test-dependencies",
    "circuit",
    "zip32-addresses",
]

[[test]]
name = "platform_smoke"
path = "tests/platform_smoke.rs"

[[bench]]
name = "circuit"
path = "benches/circuit.rs"
harness = false
required-features = [
    "test-dependencies",
    "circuit",
    "zip32-addresses",
]

[[bench]]
name = "ironwood_k11_prover"
path = "benches/ironwood_k11_prover.rs"
harness = false
required-features = [
    "test-dependencies",
    "circuit",
    "zip32-addresses",
]

[[bench]]
