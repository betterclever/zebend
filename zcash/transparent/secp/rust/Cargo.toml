[package]
name = "secp-vectors"
version = "0.1.0"
edition = "2021"
description = "ECDSA / public-key test vectors from libsecp256k1 (rust secp256k1 0.33) for zcash/transparent/secp"

[dependencies]
secp256k1 = { version = "0.33", features = ["rand", "std"] }
rand = "0.9"
sha2 = "0.10"

[profile.release]
opt-level = 3
