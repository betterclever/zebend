[package]
name = "headers-oracle"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = { version = "0.14", features = ["tls-webpki-roots", "transport"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
equihash = "0.2"
rayon = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
opt-level = 3
